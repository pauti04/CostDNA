name: docker-release

# Builds and publishes the CostDNA Docker image to Docker Hub
# whenever a tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
#
# Setup:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     DOCKERHUB_USERNAME = pauti04
#     DOCKERHUB_TOKEN    = <token from hub.docker.com/settings/security>

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}        # also allow manual runs

jobs:
  check-secrets:
    # Skip the build if Docker Hub credentials aren't configured.
    # This prevents a red X on every tag push when the secrets are absent
    # (which is the case until the user adds DOCKERHUB_USERNAME +
    # DOCKERHUB_TOKEN under Settings → Secrets and variables → Actions).
    runs-on: ubuntu-latest
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::DOCKERHUB_TOKEN not set; skipping docker-release. Add the secret to enable publishing."
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has_creds == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          REF="${{ github.ref_name }}"
          # If triggered manually, use 'latest' only.
          if [[ "$REF" == v* ]]; then
            VERSION="${REF#v}"
            echo "tags=pauti04/costdna:$VERSION,pauti04/costdna:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=pauti04/costdna:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
