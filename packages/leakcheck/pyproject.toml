[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "0.1.0"
description = "Catch label leakage before you report accuracy — find columns that deterministically encode your target."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parth Auti" }]
keywords = ["machine-learning", "data-leakage", "label-leakage", "target-leakage",
            "data-quality", "benchmark", "pandas", "ml-methodology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
leakcheck = "leakcheck.cli:main"

[project.urls]
Homepage = "https://github.com/pauti04/leakcheck"
"Case study" = "https://github.com/pauti04/CostDNA#the-audit"

[tool.setuptools.packages.find]
where = ["src"]
