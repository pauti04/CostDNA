name: ci

# Activates once leakaudit is its own repo (GitHub only runs workflows from
# the repository root's .github/workflows). Inside the CostDNA monorepo this
# file is a ready-to-use template — see PUBLISHING.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
