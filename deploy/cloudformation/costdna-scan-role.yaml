AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CostDNA scan role — a least-privilege, read-only IAM role that lets CostDNA
  discover and attribute untagged resources in this account. Safe by default:
  read-only. Tag write-back is a separate, opt-in grant (EnableTagWriteback),
  scoped so it only ever touches resources CostDNA has marked. Supports
  cross-account assumption with an ExternalId (the confused-deputy-safe
  pattern) for the managed-scan use case, or same-account assumption for
  the self-hosted CLI.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Who may assume the role" }
        Parameters: [TrustedPrincipalArn, ExternalId]
      - Label: { default: "Permissions" }
        Parameters: [EnableTagWriteback, RoleName]
    ParameterLabels:
      TrustedPrincipalArn: { default: "Principal allowed to assume this role" }
      ExternalId: { default: "External ID (managed-scan only; leave blank for self-hosted)" }
      EnableTagWriteback: { default: "Allow CostDNA to write inferred tags back" }
      RoleName: { default: "Role name" }

Parameters:
  TrustedPrincipalArn:
    Type: String
    Default: ""
    Description: >
      ARN of the principal permitted to assume this role (e.g. your IAM user,
      a CI role, or the CostDNA managed-scan account). Leave blank to trust
      the account root (any principal in THIS account with sts:AssumeRole).

  ExternalId:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Optional shared secret required on AssumeRole. Recommended for the
      managed-scan (cross-account) case to prevent the confused-deputy
      problem. Leave blank for self-hosted CLI use.

  EnableTagWriteback:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, additionally grants write access to tag EC2/RDS/Lambda/S3
      resources — gated so it can only modify resources already marked
      managed_by=costdna. Default false = strictly read-only.

  RoleName:
    Type: String
    Default: "CostDNAScanRole"
    Description: Name for the created role.

Conditions:
  HasTrustedPrincipal: !Not [!Equals [!Ref TrustedPrincipalArn, ""]]
  HasExternalId: !Not [!Equals [!Ref ExternalId, ""]]
  WritebackEnabled: !Equals [!Ref EnableTagWriteback, "true"]

Resources:
  CostDNAScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only role for CostDNA cost-attribution scans.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - HasTrustedPrincipal
                - !Ref TrustedPrincipalArn
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals: { "sts:ExternalId": !Ref ExternalId }
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: CostDNAReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverAndAttribute
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeFlowLogs
                  - rds:DescribeDBInstances
                  - lambda:ListFunctions
                  - s3:ListAllMyBuckets
                  - s3:GetBucketTagging
                  - iam:ListRoles
                  - iam:ListUsers
                  - iam:GetRole
                  - iam:GetUser
                  - iam:ListAttachedRolePolicies
                  - ce:GetCostAndUsage
                  - ce:GetCostAndUsageWithResources
                  - ce:GetCostCategories
                Resource: "*"
      Tags:
        - { Key: app, Value: costdna }
        - { Key: managed_by, Value: costdna }

  # Opt-in tag write-back — attached ONLY when EnableTagWriteback=true.
  # Scoped by the aws:ResourceTag/managed_by=costdna condition so it can never
  # touch a resource CostDNA didn't already mark. Least privilege by design.
  CostDNAWritebackPolicy:
    Type: AWS::IAM::Policy
    Condition: WritebackEnabled
    Properties:
      PolicyName: CostDNATagWriteback
      Roles: [!Ref CostDNAScanRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TagWriteback
            Effect: Allow
            Action:
              - ec2:CreateTags
              - rds:AddTagsToResource
              - lambda:TagResource
              - s3:PutBucketTagging
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/managed_by": costdna

Outputs:
  RoleArn:
    Description: >
      ARN of the CostDNA scan role. Add a profile to ~/.aws/config with
      `role_arn = <this>` and `source_profile = <your-creds>`, then run
      `costdna scan --aws-profile costdna` (boto3 assumes the role automatically).
    Value: !GetAtt CostDNAScanRole.Arn
  RoleName:
    Description: Name of the created role.
    Value: !Ref CostDNAScanRole
  Mode:
    Description: Whether tag write-back was enabled.
    Value: !If [WritebackEnabled, "read + tag-writeback", "read-only"]
