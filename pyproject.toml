[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costdna"
version = "0.2.0"
description = "Semantic + behavioral GNN for AWS cost attribution. Infers which team owns each AWS resource — even untagged ones — and writes the tags back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CostDNA" }]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "statsmodels>=0.14",
    "sentence-transformers>=2.5",   # semantic feature extraction
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "umap-learn>=0.5"]
ui  = ["streamlit>=1.32"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
costdna = "costdna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
