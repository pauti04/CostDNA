[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costdna"
version = "0.1.0"
description = "Behavioral fingerprinting for AWS cost attribution. Tells you which team owns every resource — even untagged ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CostDNA" }]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
costdna = "costdna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
