[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costdna"
version = "0.2.0"
description = "Semantic + behavioral GNN for AWS cost attribution. Infers which team owns each AWS resource — even untagged ones — and writes the tags back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CostDNA" }]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "rich>=13.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "statsmodels>=0.14",
    "sentence-transformers>=2.5",   # semantic feature extraction
]

[project.optional-dependencies]
viz   = ["matplotlib>=3.8", "umap-learn>=0.5"]
ui    = ["streamlit>=1.32"]
agent = ["anthropic>=0.40"]
dev   = ["pytest>=8.0", "ruff>=0.4"]
# Multi-cloud: live collectors are implemented per official SDK patterns
# but UNTESTED against live Azure/GCP accounts as of v0.2. AWS is the
# production-tested path. See src/costdna/collectors/{azure_live,gcp}.py
# for implementation status.
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-monitor>=6.0",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-network>=25.0",
]
gcp   = [
    "google-cloud-asset>=3.20",
    "google-cloud-logging>=3.8",
    "google-cloud-billing>=1.12",
]

[project.scripts]
costdna = "costdna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E702 (semicolon-separated statements) is intentional terse style in
# plotting/CLI helpers — keep the rule off so CI doesn't flag it.
ignore = ["E702"]
